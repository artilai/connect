name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@artil-ai/connect
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Compare with the published version
        id: version
        run: |
          version="$(jq -r .version apps/server/package.json)"
          published="$(curl -fsSL "https://registry.npmjs.org/@artil-ai/connect/$version" | jq -r .version || true)"
          echo "Package has $version, npm has ${published:-nothing}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "$published" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        uses: ./.github/actions/install
      - name: Set up Node
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        if: steps.version.outputs.changed == 'true'
        run: npm install --global npm@11
      - name: Build and publish
        if: steps.version.outputs.changed == 'true'
        run: |
          bun run build
          npm publish apps/server/dist

  github:
    name: Release on GitHub
    needs: release
    if: needs.release.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes
